name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# electron-builder does not publish here on purpose: its GitHub publisher
# can create the release twice when several artifacts finish at the same
# moment (one per concurrent upload), which leaves two releases on one tag
# with the files split between them. Instead the artifacts are uploaded
# with action-gh-release, which creates the release once and appends to it.
# The jobs run in sequence for the same reason.
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (mac, signed + notarized)
        run: pnpm run pack:mac
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # The release commit's body is the changelog; use it as the notes
      - name: Release notes from commit message
        run: git log -1 --format=%b > release-notes.md

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  win:
    needs: mac
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (win)
        run: pnpm run pack:win

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
